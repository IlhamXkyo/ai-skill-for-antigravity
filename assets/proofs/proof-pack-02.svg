  <text x="842" y="402" fill="#F5F6FA" font-family="Plus Jakarta Sans,Segoe UI,sans-serif" font-size="13">Menyatukan solusi terkuat &amp; menguji 1.000 kasus</text>
  <text x="842" y="422" fill="#34D399" font-family="JetBrains Mono,Consolas,monospace" font-size="11.5" font-weight="700">✓ 1,000 / 1,000 Hypothesis Edge-Cases PASSED</text>

