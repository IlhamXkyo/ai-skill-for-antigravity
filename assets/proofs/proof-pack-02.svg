  <text x="844" y="512" fill="#F5F6FA" font-family="Plus Jakarta Sans,Segoe UI,sans-serif" font-size="18" font-weight="700">uv · ruff · ty · pytest</text>
  <text x="1085" y="512" fill="#34D399" font-family="JetBrains Mono,Consolas,monospace" font-size="16" font-weight="700">0 Errors</text>

