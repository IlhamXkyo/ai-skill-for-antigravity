  <rect x="44" y="582" width="1192" height="142" rx="14" fill="#090D16" stroke="#F5F6FA" stroke-opacity="0.12"/>
  <text x="72" y="616" fill="#34D399" font-family="JetBrains Mono,Consolas,monospace" font-size="12" font-weight="700">APA YANG KAMU DAPATKAN DI PACK-02 (SOFTWARE ENGINEER &amp; SYSTEM ARCHITECT):</text>
  <text x="72" y="646" fill="#F5F6FA" font-family="Plus Jakarta Sans,Segoe UI,sans-serif" font-size="14">• <tspan font-weight="700" fill="#34D399">Pro-Architect &amp; Dialectic-Architect:</tspan> Struktur kode rapi 4-lapis yang sudah didebatkan oleh 3 agen AI agar tahan banting.</text>
  <text x="72" y="674" fill="#F5F6FA" font-family="Plus Jakarta Sans,Segoe UI,sans-serif" font-size="14">• <tspan font-weight="700" fill="#38BDF8">Property-Based Testing &amp; Modern Python:</tspan> Pengujian otomatis ribuan input ekstrem untuk mencegah bug di produksi.</text>
  <text x="72" y="702" fill="#F5F6FA" font-family="Plus Jakarta Sans,Segoe UI,sans-serif" font-size="14">• <tspan font-weight="700" fill="#E2B86B">Karpathy Surgical Discipline:</tspan> AI menulis kode bersih tanpa merusak fitur lain yang sudah berjalan dan tanpa fungsi kosong.</text>
