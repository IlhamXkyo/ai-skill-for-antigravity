  <text x="104" y="508" fill="#94A3B8" font-family="Plus Jakarta Sans,Segoe UI,sans-serif" font-size="12.5">Siap langsung dipakai di proyek React, Next.js, Vue, atau HTML/CSS milikmu.</text>

