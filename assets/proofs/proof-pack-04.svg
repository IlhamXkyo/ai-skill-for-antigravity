  <text x="708" y="460" fill="#94A3B8" font-family="Plus Jakarta Sans,Segoe UI,sans-serif" font-size="12.5">• Agen Alpha mencari celah bug/ide fitur, Agen Beta menulis kode &amp; unit test.</text>
  <text x="708" y="484" fill="#94A3B8" font-family="Plus Jakarta Sans,Segoe UI,sans-serif" font-size="12.5">• Otomatis merapikan README, dokumentasi, dan push ke repositori GitHub kamu.</text>
  <text x="708" y="514" fill="#34D399" font-family="JetBrains Mono,Consolas,monospace" font-size="11.5" font-weight="700">★ GitHub Release Ready · CI/CD &amp; Property Tests Verified</text>

  <!-- Bottom Buyer Summary -->
  <rect x="44" y="582" width="1192" height="142" rx="14" fill="#0C0F19" stroke="#F5F6FA" stroke-opacity="0.12"/>
  <text x="72" y="616" fill="#FF6B2C" font-family="JetBrains Mono,Consolas,monospace" font-size="12" font-weight="700">APA YANG KAMU DAPATKAN DI PACK-04 (REVERSE ENGINEERING &amp; GITHUB AUTOMATION):</text>
  <text x="72" y="646" fill="#F5F6FA" font-family="Plus Jakarta Sans,Segoe UI,sans-serif" font-size="14">• <tspan font-weight="700" fill="#FF6B2C">Plugin REA (/rea):</tspan> Punya referensi web atau animasi keren di internet? AI akan membedah dan membuatkan kode bersihnya untukmu.</text>
  <text x="72" y="674" fill="#F5F6FA" font-family="Plus Jakarta Sans,Segoe UI,sans-serif" font-size="14">• <tspan font-weight="700" fill="#34D399">Plugin GitHubMe (/githubme):</tspan> Dua agen AI berdiskusi otomatis untuk mengaudit repo GitHub kamu atau merilis proyek open-source baru.</text>
  <text x="72" y="702" fill="#F5F6FA" font-family="Plus Jakarta Sans,Segoe UI,sans-serif" font-size="14">• <tspan font-weight="700" fill="#38BDF8">Chrome DevTools &amp; Error Recovery:</tspan> Inspeksi langsung elemen web, jaringan API, dan perbaikan bug secara akurat.</text>
